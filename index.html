<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#24233d">
  <meta name="description" content="コインを落として、つなげて両替。豚の貯金箱で遊ぶドット絵の落ち物パズル、CoinGarden。">
  <title>CoinGarden</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #17152b; color: #fff1c5; }
    body { font-family: ui-monospace, monospace; }
    canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 16px; text-align: center; background: #24233d; padding: 24px; }
    #loading[hidden] { display: none; }
    progress { width: min(320px, 80vw); accent-color: #f5d478; height: 12px; }
    #message { margin: 0; line-height: 1.6; }
  </style>
  <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="CoinGarden ゲーム画面"></canvas>
  <div id="loading">
    <p id="message" role="status">読み込み中…</p>
    <progress id="progress" aria-label="ゲームの読み込み"></progress>
  </div>
  <noscript>このゲームを遊ぶにはJavaScriptを有効にしてください。</noscript>
  <script src="index.js"></script>
  <script>
    const config = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":2596640,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
    const progress = document.getElementById('progress');
    const message = document.getElementById('message');
    const engine = new Engine(config);
    const missing = Engine.getMissingFeatures({ threads: false });
    if (missing.length) {
      progress.hidden = true;
      message.textContent = 'WebGL 2に対応したブラウザで開いてください。';
    } else {
      engine.startGame({
        onProgress: (current, total) => {
          if (total > 0) { progress.max = total; progress.value = current; }
        },
      }).then(() => {
        document.getElementById('loading').hidden = true;
        document.getElementById('canvas').focus();
      }).catch(error => {
        console.error(error);
        progress.hidden = true;
        message.textContent = '読み込めませんでした。ページを再読み込みしてください。';
      });
    }
  </script>
</body>
</html>
